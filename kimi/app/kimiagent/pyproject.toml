[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kimiagent"
version = "0.1.0"
description = "AgentCore Runtime agent using the Kimi agent harness with Claude on Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock] >= 1.15.0",
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "kimi-agent-sdk >= 0.0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
